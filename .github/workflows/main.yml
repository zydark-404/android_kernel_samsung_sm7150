name: Build Kernel for Samsung A71 with APatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libncurses5-dev libncurses-dev \
            git zip unzip wget ccache \
            libelf-dev clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python-is-python3 libtinfo5

      - name: Download Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Download KernelPatch Tools
        run: |
          # 使用 0.13.8，修复了 pre-6.x 内核的启动问题
          wget https://github.com/bmax121/KernelPatch/releases/download/0.13.8/kptools-linux-x86_64 -O kptools
          wget https://github.com/bmax121/KernelPatch/releases/download/0.13.8/kpimg-android -O kpimg
          chmod +x kptools

      - name: Download AnyKernel3 Template
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Configure APatch Kernel Requirements
        run: |
          # 在 defconfig 中追加 APatch 必需的配置项
          cat >> arch/arm64/configs/a71_eur_open_defconfig << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KPROBES=y
          CONFIG_KPROBES_ON_FTRACE=y
          CONFIG_PROC_KCORE=y
          CONFIG_DEBUG_FS=y
          CONFIG_FRAME_POINTER=y
          EOF

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out a71_eur_open_defconfig
          make -j$(nproc) O=out CC=clang KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error"

      - name: Locate Compiled Kernel Image
        id: find_image
        run: |
          for f in out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz; do
            if [ -f "$f" ]; then
              echo "kernel_path=$f" >> $GITHUB_OUTPUT
              echo "kernel_name=$(basename $f)" >> $GITHUB_OUTPUT
              echo "Found: $f"
              exit 0
            fi
          done
          echo "Error: No kernel image found"
          exit 1

      - name: Inject KernelPatch (kptools)
        run: |
          ./kptools -p \
            --image ${{ steps.find_image.outputs.kernel_path }} \
            --skey "YOUR_SECURE_KEY_HERE" \
            --kpimg kpimg \
            --out Image-patched
          
          if [ ! -f Image-patched ]; then
            echo "kptools failed. Exit code: $?"
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          cp Image-patched AnyKernel3/${{ steps.find_image.outputs.kernel_name }}
          cd AnyKernel3
          # 必须先手动修改 anykernel.sh 中的 BLOCK 参数为 A71 的实际 boot 分区
          zip -r9 ../A71_Kernel_APatch_Patched.zip *

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A71-Kernel-APatch-OneUI
          path: A71_Kernel_APatch_Patched.zip
