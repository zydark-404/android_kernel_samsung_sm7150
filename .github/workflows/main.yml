name: Build Kernel for Samsung A71 with APatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git zip unzip wget ccache
          
      - name: Download Proton Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Download kptools (APatch CLI)
        run: |
          wget https://github.com/bmax121/APatch/releases/download/v10763/kptools-linux-x86_64 -O kptools
          chmod +x kptools

      - name: Download AnyKernel3 Template
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # إعداد الملف للروم الرسمي One UI
          make O=out a71_eur_open_defconfig
          make -j$(nproc) O=out CC=clang

      - name: Inject APatch KernelPatch (kptools)
        run: |
          # حقن الـ APatch بالسوبركاي الخاص بك
          ./kptools -p -i out/arch/arm64/boot/Image.gz-dtb -S youssa@31 -o Image.gz-dtb-patched

      - name: Package with AnyKernel3
        run: |
          cp Image.gz-dtb-patched AnyKernel3/OneUI-New-Image.gz-dtb
          cd AnyKernel3
          zip -r9 ../A71_Kernel_APatch_Patched.zip *

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v3
        with:
          name: A71-Kernel-APatch-OneUI
          path: A71_Kernel_APatch_Patched.zip
