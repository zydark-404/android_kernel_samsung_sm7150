name: Build Custom Kernel with Integrated APatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev git zip unzip wget ccache libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download AOSP Clang Toolchain (r383902)
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz -C clang
          rm clang-r383902.tar.gz

      - name: Integrate KernelPatch (APatch Core)
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git kernelpatch
          if ! grep -q "kernelpatch" Makefile; then
            echo "obj-y += kernelpatch/" >> Makefile
          fi

      - name: Download AnyKernel3 Template
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Compile Kernel with APatch & ZYDARK Signature
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # البحث عن ملف defconfig المناسب
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*a71*" -o -name "*7150*" | head -n 1 | xargs basename)
          if [ -z "$DEFCONFIG_FILE" ]; then
            DEFCONFIG_FILE="a71_eur_open_defconfig"
          fi
          echo "Using Defconfig: $DEFCONFIG_FILE"

          make O=out $DEFCONFIG_FILE

          # تفعيل متطلبات APatch الكامله
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          
          # إدراج التوقيع المخصص
          echo 'CONFIG_LOCALVERSION="-ZYDARK-APatch"' >> out/.config

          make -j$(nproc) O=out \
            CC=$(pwd)/clang/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/OneUI-New-Image.gz-dtb || cp out/arch/arm64/boot/Image.gz AnyKernel3/OneUI-New-Image.gz-dtb
          cd AnyKernel3
          zip -r9 ../A71_Kernel_ZYDARK_APatch.zip *

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A71-Kernel-ZYDARK-APatch-Custom
          path: A71_Kernel_ZYDARK_APatch.zip
